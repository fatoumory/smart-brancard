# nginx du conteneur frontend : sert la PWA et transmet /api au backend.
# Le navigateur ne parle qu'à une seule adresse : pas de CORS, et en HTTPS le WebSocket passe en wss://

# Connexion « Upgrade » pour le WebSocket du temps réel (/api/ws), normale sinon
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # HTTPS pour les téléphones (caméra et NFC), certificat auto-signé créé dans le Dockerfile
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certificat.pem;
    ssl_certificate_key /etc/nginx/cle.pem;

    root /usr/share/nginx/html;

    # /api/missions -> http://backend:8000/missions (le préfixe /api est retiré)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le WebSocket reste ouvert sans message pendant longtemps : pas de coupure au bout de 60 s
        proxy_read_timeout 1h;
    }

    # Le service worker et le manifeste ne sont jamais gardés en cache : une nouvelle version
    # de l'application est vue au prochain chargement
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Routes de l'application React (/regulateur, /brancardier...) : on renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
